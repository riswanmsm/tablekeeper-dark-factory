<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TableKeeper - Autonomous Reservation Engine</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --border: #23314d;
      --accent: #0ea5e9;
      --accent-hover: #0284c7;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --success-bg: #064e3b;
      --success-text: #6ee7b7;
      --error-bg: #7f1d1d;
      --error-text: #fca5a5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background: rgba(14, 165, 233, 0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    p.lead {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }
    @media (min-width: 768px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .card h2 {
      font-size: 1.15rem;
      margin-bottom: 1rem;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-top: 0.75rem;
      margin-bottom: 0.25rem;
      text-transform: uppercase;
    }
    input, select {
      width: 100%;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: var(--accent);
    }
    .btn {
      width: 100%;
      margin-top: 1.25rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: none;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    .btn-stress {
      background: #4f46e5;
      color: #fff;
      margin-top: 0.75rem;
    }
    .btn-stress:hover {
      background: #4338ca;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status-box {
      margin-top: 1rem;
      padding: 0.85rem;
      border-radius: 8px;
      font-size: 0.875rem;
      display: none;
      line-height: 1.4;
    }
    .status-box.success {
      display: block;
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid #059669;
    }
    .status-box.error {
      display: block;
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid #dc2626;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      font-size: 0.85rem;
    }
    th, td {
      text-align: left;
      padding: 0.6rem 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    th {
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
    }
    .table-tag {
      background: #1e293b;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header data-testid="app-header">
      <div>
        <div class="badge">ArchitectOS Clean-Room Engine</div>
        <h1 data-testid="app-title">🍽️ TableKeeper</h1>
        <p class="lead">Autonomous restaurant reservation engine with zero double-booking concurrency guarantee.</p>
      </div>
      <div>
        <span style="font-size: 0.85rem; color: #10b981; font-weight: 600;">● Engine Online (WAL Mode)</span>
      </div>
    </header>

    <div class="grid">
      <!-- Left Card: Make a Reservation -->
      <div class="card">
        <h2>🗓️ Reserve a Table</h2>
        
        <label for="restaurantSelect">Restaurant</label>
        <select id="restaurantSelect" data-testid="restaurant-select" onchange="loadTables()">
          <option value="rest_luminary">Bistro Luminary (PST / America/Los_Angeles)</option>
          <option value="rest_elysian">Elysian Table (EST / America/New_York)</option>
        </select>

        <label for="tableSelect">Select Table</label>
        <select id="tableSelect" data-testid="table-select">
          <!-- Loaded dynamically -->
        </select>

        <label for="guestName">Guest Name</label>
        <input type="text" id="guestName" data-testid="guest-name-input" value="Elena Rostova">

        <label for="guestEmail">Guest Email</label>
        <input type="email" id="guestEmail" data-testid="guest-email-input" value="elena@example.com">

        <label for="partySize">Party Size</label>
        <input type="number" id="partySize" data-testid="party-size-input" value="2" min="1" max="10">

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
          <div>
            <label for="startTime">Start (UTC)</label>
            <input type="text" id="startTime" data-testid="start-time-input" value="2026-10-05T19:00:00Z">
          </div>
          <div>
            <label for="endTime">End (UTC)</label>
            <input type="text" id="endTime" data-testid="end-time-input" value="2026-10-05T20:30:00Z">
          </div>
        </div>

        <button id="bookBtn" class="btn btn-primary" data-testid="confirm-booking-btn" onclick="submitBooking()">
          Confirm Reservation
        </button>

        <button id="stressBtn" class="btn btn-stress" data-testid="stress-test-btn" onclick="runClientStressTest()">
          ⚡ Fire 20 Concurrent Booking Competitors
        </button>

        <div id="statusBox" data-testid="booking-status" class="status-box"></div>
      </div>

      <!-- Right Card: Live Reservations -->
      <div class="card">
        <h2>📋 Confirmed Bookings (Live)</h2>
        <div style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem;">
          <button class="btn btn-primary" style="margin-top: 0; padding: 0.4rem 0.75rem; font-size: 0.8rem;" onclick="loadReservations()">Refresh Live Board</button>
        </div>
        <div style="overflow-x: auto;">
          <table data-testid="reservations-table">
            <thead>
              <tr>
                <th>Table</th>
                <th>Guest</th>
                <th>Party</th>
                <th>Window (UTC)</th>
              </tr>
            </thead>
            <tbody id="reservationsBody">
              <tr><td colspan="4" style="text-align: center; color: var(--muted);">Loading bookings...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function loadTables() {
      const restId = document.getElementById('restaurantSelect').value;
      const select = document.getElementById('tableSelect');
      try {
        const resp = await fetch(`/api/tables?restaurant_id=${restId}`);
        const tables = await resp.json();
        select.innerHTML = tables.map(t => 
          `<option value="${t.id}">Table #${t.table_number} (${t.location_zone}, max: ${t.capacity})</option>`
        ).join('');
      } catch (err) {
        console.error("Failed to load tables", err);
      }
      loadReservations();
    }

    async function loadReservations() {
      const restId = document.getElementById('restaurantSelect').value;
      const tbody = document.getElementById('reservationsBody');
      try {
        const resp = await fetch(`/api/reservations?restaurant_id=${restId}`);
        const bookings = await resp.json();
        if (bookings.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--muted);">No bookings yet for this restaurant.</td></tr>';
          return;
        }
        tbody.innerHTML = bookings.map(b => `
          <tr>
            <td><span class="table-tag">${b.table_id}</span></td>
            <td><strong>${b.customer_name}</strong></td>
            <td>${b.party_size}</td>
            <td>${b.start_time.substring(11, 16)} - ${b.end_time.substring(11, 16)}</td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" style="color: #f87171;">Error loading bookings: ${err.message}</td></tr>`;
      }
    }

    async function submitBooking() {
      const btn = document.getElementById('bookBtn');
      const statusBox = document.getElementById('statusBox');
      btn.disabled = true;
      btn.innerText = "Processing Transaction...";
      statusBox.className = "status-box";

      const payload = {
        restaurant_id: document.getElementById('restaurantSelect').value,
        table_id: document.getElementById('tableSelect').value,
        customer_name: document.getElementById('guestName').value,
        customer_email: document.getElementById('guestEmail').value,
        party_size: parseInt(document.getElementById('partySize').value),
        start_time: document.getElementById('startTime').value,
        end_time: document.getElementById('endTime').value,
        idempotency_key: "ui_" + Math.random().toString(36).substring(2, 10)
      };

      try {
        const resp = await fetch('/api/reservations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await resp.json();
        if (resp.ok) {
          statusBox.className = "status-box success";
          statusBox.innerHTML = `✓ <strong>Reservation Confirmed!</strong><br/>ID: <code>${data.id}</code><br/>Status: ${data.status} | Replayed: ${data.is_replayed}`;
          loadReservations();
        } else {
          statusBox.className = "status-box error";
          statusBox.innerHTML = `✗ <strong>Booking Rejected (${resp.status}):</strong><br/>${data.detail || 'Conflict'}`;
        }
      } catch (err) {
        statusBox.className = "status-box error";
        statusBox.innerHTML = `✗ <strong>Network Error:</strong> ${err.message}`;
      } finally {
        btn.disabled = false;
        btn.innerText = "Confirm Reservation";
      }
    }

    async function runClientStressTest() {
      const btn = document.getElementById('stressBtn');
      const statusBox = document.getElementById('statusBox');
      btn.disabled = true;
      btn.innerText = "⚡ Firing 20 Concurrent Requests...";
      statusBox.className = "status-box";

      const restId = document.getElementById('restaurantSelect').value;
      const tableId = document.getElementById('tableSelect').value;
      const startTime = document.getElementById('startTime').value;
      const endTime = document.getElementById('endTime').value;

      const promises = [];
      for (let i = 1; i <= 20; i++) {
        promises.push(
          fetch('/api/reservations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              restaurant_id: restId,
              table_id: tableId,
              customer_name: `Stress Competitor #${i}`,
              customer_email: `competitor${i}@stress.com`,
              party_size: 2,
              start_time: startTime,
              end_time: endTime,
              idempotency_key: `stress_${Date.now()}_${i}`
            })
          }).then(async r => ({ status: r.status, data: await r.json() }))
        );
      }

      const results = await Promise.all(promises);
      const successes = results.filter(r => r.status === 201);
      const conflicts = results.filter(r => r.status === 409);

      statusBox.className = successes.length === 1 ? "status-box success" : "status-box error";
      statusBox.innerHTML = `
        <strong>⚡ Concurrency Race Test Result:</strong><br/>
        • Concurrent Requests Dispatched: 20<br/>
        • Successful Bookings: <strong>${successes.length}</strong> (Expected: 1)<br/>
        • 409 Conflicts Caught: <strong>${conflicts.length}</strong> (Expected: 19)<br/>
        • Invariant Status: <strong>${successes.length === 1 ? 'PASSED (Zero Double-Booking)' : 'VIOLATION DETECTED'}</strong>
      `;
      loadReservations();
      btn.disabled = false;
      btn.innerText = "⚡ Fire 20 Concurrent Booking Competitors";
    }

    // Initial load
    window.addEventListener('DOMContentLoaded', loadTables);
  </script>
</body>
</html>
